<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHost - Web Hosting</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Light Variables & Global Reset */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --card-border: rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Navbar Layout */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-btn {
            text-decoration: none;
            background-color: var(--accent-light);
            color: var(--accent);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background-color: var(--accent);
            color: white;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
        }

        /* Hero Setup */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8rem 2rem 4rem 2rem;
            background: radial-gradient(circle at top, rgba(37, 99, 235, 0.05), transparent 60%);
            position: relative;
        }

        .hero-content {
            max-width: 700px;
        }

        .tag {
            display: inline-block;
            background-color: var(--bg-secondary);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* UI Actions & Utility Buttons */
        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn.primary {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);
        }

        .btn.primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn.secondary:hover {
            background-color: var(--bg-primary);
            border-color: rgba(15, 23, 42, 0.15);
        }

        /* Generic Section Formatting */
        .section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            margin-bottom: 4rem;
        }

        .title p {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .title h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Features Display Grid */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(37, 99, 235, 0.15);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 1.25rem;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Pricing Area Framework */
        .pricing-section {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            padding: 6rem 2rem;
        }

        .pricing {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            align-items: center;
        }

        .price-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            position: relative;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .price-card.popular {
            background-color: var(--bg-secondary);
            border: 2px solid var(--accent);
            box-shadow: var(--shadow-lg);
            transform: scale(1.03);
            z-index: 2;
        }

        .popular-label {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background-color: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            letter-spacing: 0.5px;
        }

        .price-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .price {
            font-size: 2.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 2rem;
            letter-spacing: -1px;
        }

        .price span {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0;
        }

        .price-card ul {
            list-style: none;
            margin-bottom: 2.5rem;
        }

        .price-card li {
            padding: 0.6rem 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.04);
        }

        .choose-btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--bg-secondary);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .price-card.popular .choose-btn {
            background-color: var(--accent);
            color: white;
border: none;
box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
}
.price-card.popular .choose-btn:hover {
background-color: var(--accent-hover);
}
.choose-btn:hover {
background-color: var(--bg-primary);
border-color: rgba(15, 23, 42, 0.2);
}
/* Banner CTA Layer */
.cta {
padding: 6rem 2rem;
text-align: center;
background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
border-bottom: 1px solid var(--card-border);
}
.cta h2 {
font-size: 2.5rem;
font-weight: 800;
margin-bottom: 1rem;
letter-spacing: -0.5px;
}
.cta p {
color: var(--text-muted);
font-size: 1.1rem;
margin-bottom: 2rem;
}
/* Interactive Contact Form Container */
.contact form {
max-width: 550px;
margin: 0 auto;
background-color: var(--bg-secondary);
padding: 3rem;
border-radius: 16px;
border: 1px solid var(--card-border);
box-shadow: var(--shadow-md);
}
.contact input,
.contact textarea {
width: 100%;
padding: 0.85rem 1rem;
margin-bottom: 1.25rem;
border-radius: 8px;
border: 1px solid var(--card-border);
background-color: var(--bg-primary);
color: var(--text-main);
font-family: inherit;
font-size: 0.95rem;
transition: var(--transition);
}
.contact input:focus,
.contact textarea:focus {
outline: none;
border-color: var(--accent);
background-color: var(--bg-secondary);
box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}
.contact textarea {
min-height: 140px;
resize: vertical;
}
.contact button {
width: 100%;
}
#formMessage {
margin-top: 1rem;
text-align: center;
font-size: 0.9rem;
font-weight: 500;
}
/* Sticky Footer Rules */
footer {
background-color: var(--bg-secondary);
border-top: 1px solid var(--card-border);
padding: 4rem 2rem;
text-align: center;
}
.footer-logo {
font-size: 1.5rem;
font-weight: 700;
margin-bottom: 0.75rem;
}
.footer-logo span {
color: var(--accent);
}
footer p {
color: var(--text-muted);
font-size: 0.95rem;
margin-bottom: 0.5rem;
}
footer .copyright {
margin-top: 1.5rem;
font-size: 0.85rem;
color: rgba(15, 23, 42, 0.4);
}
/* Screen Breakpoints Matrix */
@media (max-width: 968px) {
.hero h1 {
font-size: 2.75rem;
}
.pricing {
grid-template-columns: 1fr;
max-width: 450px;
}
.price-card.popular {
transform: scale(1);
}
}
@media (max-width: 768px) {
.menu-btn {
display: block;
}
.nav-links {
display: none;
position: absolute;
top: 100%;
left: 0;
width: 100%;
background-color: var(--bg-secondary);
flex-direction: column;
padding: 2rem;
gap: 1.5rem;
text-align: center;
border-bottom: 1px solid var(--card-border);
box-shadow: var(--shadow-md);
}
.nav-links.active {
display: flex;
}
.nav-btn {
display: none;
}
.hero-buttons {
flex-direction: column;
}
.contact form {
padding: 2rem 1.5rem;
}
}

document.addEventListener('DOMContentLoaded', () => {
const menuBtn = document.getElementById('menuBtn');
const navLinks = document.getElementById('navLinks');
if (menuBtn && navLinks) {
menuBtn.addEventListener('click', () => {
navLinks.classList.toggle('active');
});
// Auto close mobile panel upon node tracking clicks
navLinks.querySelectorAll('a').forEach(link => {
link.addEventListener('click', () => {
navLinks.classList.remove('active');
});
});
}
const contactForm = document.getElementById('contactForm');
const formMessage = document.getElementById('formMessage');
if (contactForm && formMessage) {
contactForm.addEventListener('submit', (e) => {
e.preventDefault();
formMessage.style.color = '#16a34a';
formMessage.textContent = 'Thank you! Your message has been sent successfully.';
contactForm.reset();
});
}
});
